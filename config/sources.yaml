# Rejestr zrodel. Dodanie/wylaczenie zrodla = edycja tego pliku, bez ruszania kodu.
# method: python | firecrawl | fixture     fallback: firecrawl (opcjonalny)
# enabled: false -> zrodlo pomijane w runie bez zmian w kodzie.
#
# UWAGA: wszystkie zewnetrzne zrodla sa domyslnie wylaczone (enabled: false).
# Wlaczaj tylko zrodla, do ktorych masz uprawnienia — patrz docs/responsible-use.md.
sources:
  - id: crossweb
    name: "Crossweb"
    streams: [ai_digital]
    method: python
    fallback: firecrawl
    enabled: false
    base_url: "https://crossweb.pl"
    listing_url: "https://crossweb.pl/wydarzenia/"
    parser: python_crossweb
    fallback_parser: firecrawl_json_events   # fallback dla stron renderowanych JS / niedostepnych bezposrednio
    firecrawl_prompt: "Wyciagnij wydarzenia branzowe IT/tech/AI/data/digital/programowanie: nazwa, data jako ISO YYYY-MM-DD, miasto, link do wydarzenia."
    firecrawl_subcategory: "meetup"
    rate_limit_seconds: 2

  # Meetup — meetupy AI/tech (JSON-LD). Listing filtrowany keywords=AI + miasto.
  # Drugie zrodlo ai_digital. classify odsiewa nie-AI (English Meetup itp.).
  - id: meetup
    name: "Meetup (AI/tech Trojmiasto)"
    streams: [ai_digital]
    method: python
    enabled: false
    fallback: firecrawl                       # fallback renderujacy, gdy bezposredni request nie zwraca tresci
    fallback_parser: firecrawl_json_events
    default_city: "Trojmiasto"                # listing Gdansk-filtered -> Trojmiasto
    force_default_city: true                  # ignoruj "Online" z UI Meetup (listing juz Gdansk-filtered)
    firecrawl_prompt: "Wyciagnij wszystkie meetupy AI/tech/data widoczne na stronie: nazwa wydarzenia, data jako ISO YYYY-MM-DD, link."
    base_url: "https://www.meetup.com"
    listing_url: "https://www.meetup.com/find/?keywords=AI&location=pl--Gda%C5%84sk&source=EVENTS"
    parser: python_meetup
    rate_limit_seconds: 3

  # Trojmiasto.pl rozbity na dedykowane kategorie z force_category — pewna klasyfikacja
