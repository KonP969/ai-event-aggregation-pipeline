<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
<title id="title">AI Event Aggregation Pipeline — calendar output evidence</title>
<desc id="desc">A calendar-style rendering of the deterministic fixture digest. Six selected events appear on dates in June 2026, with one long-range concert on 15 October. The left rail records eight inputs and six qualified outputs.</desc>
